name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: aetheris
          POSTGRES_PASSWORD: aetheris-test
          POSTGRES_DB: aetheris_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aetheris -d aetheris_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://aetheris:aetheris-test@127.0.0.1:5432/aetheris_test
      REDIS_URL: redis://127.0.0.1:6379
      JWT_SECRET: ci-jwt-secret-with-at-least-32-characters
      API_KEY_PEPPER: ci-api-pepper-with-at-least-32-characters
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      SOCKET_ALLOWED_ORIGINS: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm ci --prefix dashboard
      - run: npm run check
      - run: npm run db:migrate
      - name: Start API and worker
        run: |
          node server/server.js > api.log 2>&1 &
          node worker/worker.js > worker.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3000/ready && break; sleep 1; done
      - run: npm test
        env:
          RUN_INTEGRATION_TESTS: "1"
      - run: npm run build --prefix dashboard
